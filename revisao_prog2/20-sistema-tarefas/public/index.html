<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Lista de Tarefas</h1>
    <p>Exemplo de aplicação cliente-servidor com CRUD e SQLite.</p>
  </header>

  <main>
    <section class="card">
      <h2>Nova tarefa</h2>
      <form id="form-tarefa">
        <input id="titulo" name="titulo" placeholder="Digite uma tarefa" required maxlength="120">
        <button type="submit">Cadastrar</button>
      </form>
    </section>

    <section class="card">
      <div class="topo-lista">
        <h2>Tarefas</h2>
        <button id="btn-atualizar" type="button">Atualizar</button>
      </div>
      <ul id="lista"></ul>
      <p id="mensagem"></p>
    </section>

    <section class="card">
      <h2>Fila de processamento</h2>
      <div class="fila-acoes">
        <input id="fila-titulo" placeholder="Item para a fila">
        <button id="btn-fila-adicionar" type="button">Adicionar à fila</button>
        <button id="btn-fila-chamar" type="button">Chamar próximo</button>
      </div>
      <p id="fila-status"></p>
    </section>
  </main>

  <footer>Programação II — JavaScript + Express + SQLite</footer>
  <script src="app.js"></script>
</body>
</html>
